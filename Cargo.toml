[workspace]
resolver = "2"
members = [
    "crates/fovea-mv-core",
    "crates/fovea-mv-stream",
    "crates/fovea-mv-py",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/hunheelee/fovea"
authors = ["Hunhee Lee"]

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
tracing = "0.1"
