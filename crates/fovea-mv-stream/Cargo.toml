[package]
name = "fovea-mv-stream"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Source adapters (file, RTSP, HTTP) for fovea-mv. Feeds packets into fovea-mv-core."

[lib]
path = "src/lib.rs"

[dependencies]
fovea-mv-core = { path = "../fovea-mv-core", version = "0.0.1" }
thiserror.workspace = true
tracing.workspace = true
ffmpeg-next.workspace = true
ffmpeg-sys-next.workspace = true
libc = "0.2"

[build-dependencies]
bindgen = "0.70"

[dev-dependencies]
anyhow.workspace = true
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "ffmpeg_source"
harness = false
