[package]
name = "fovea-mv-py"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for fovea-mv. Built into the fovea-mv Python package via maturin."

[lib]
name = "_fovea_mv"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
fovea-mv-core = { path = "../fovea-mv-core", version = "0.0.1" }
fovea-mv-stream = { path = "../fovea-mv-stream", version = "0.0.1" }
pyo3 = { version = "0.28", features = ["extension-module"] }
